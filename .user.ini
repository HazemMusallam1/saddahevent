; ============================================================================
;  Saddah ERP - PHP Error Reporting (Development Mode)
;  ⚠️ أوقفه في الإنتاج بتغيير display_errors إلى Off
; ============================================================================

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = error_log.txt
