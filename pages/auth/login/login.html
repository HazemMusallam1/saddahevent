    <script>
        (function () {
            if (!window.anime || !anime.svg) return; // فشل تحميل المكتبة → شبكة الأمان تُظهر الشعار
            var animate = anime.animate, createTimeline = anime.createTimeline,
                svg = anime.svg, stagger = anime.stagger, utils = anime.utils;

            // الحالات الابتدائية
            var lines = svg.createDrawable('.logo-line');
            lines.forEach(function (l) { l.draw = '0 0'; });          // الحواف غير مرسومة
            utils.set('#logo-wrap', { opacity: 0, scale: 0.82 });

            createTimeline({
                defaults: { ease: 'outQuart' },
                onComplete: function () {
                    // طفو لطيف مستمر يمنح الشعار حياة
                    animate('#logo-wrap', { translateY: [0, -9], duration: 2800, loop: true, alternate: true, ease: 'inOutSine' });
                }
            })
            // 1) دخول ناعم لحاوية الشعار
            .add('#logo-wrap', { opacity: [0, 1], scale: [0.82, 1], duration: 800, ease: 'outExpo' })
            // 2) رسم حواف الشعار من المنتصف نحو الأطراف
            .add(lines, { draw: ['0 0', '0 1'], duration: 1600, delay: stagger(45, { from: 'center' }), ease: 'inOutQuad' }, '-=350')
            // 3) ظهور الشعار الملوّن بنبضة أنيقة
            .add('#real-logo', { opacity: [0, 1], scale: [0.9, 1], duration: 900, ease: 'outBack' }, '-=450')
            // 4) تلاشي طبقة الرسم بالتزامن
            .add('#animated-logo', { opacity: [1, 0], duration: 700, ease: 'outQuad' }, '<');
        })();
    </script>

    <script>
        // شبكة أمان: لو تعذّر تحميل مكتبة الانميشن (إنترنت/حجب CDN) أظهر الشعار الأصلي
        setTimeout(() => {
            const img = document.getElementById('real-logo');
            if (img && getComputedStyle(img).opacity === '0') {
                const wrap = document.getElementById('logo-wrap');
                if (wrap) { wrap.style.opacity = '1'; wrap.style.transform = 'none'; }
                img.style.transition = 'opacity .6s ease';
                img.style.opacity = '1';
                const svgEl = document.getElementById('animated-logo');
                if (svgEl) svgEl.style.opacity = '0';
            }
        }, 4500);

        const form = document.getElementById('login-form');
        const errEl = document.getElementById('login-error');
        const errText = document.getElementById('error-text');
        const btn = document.getElementById('login-btn');
        const passInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-icon');

        // إظهار/إخفاء كلمة المرور
        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passInput.style.letterSpacing = 'normal';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                passInput.style.letterSpacing = '0.1em';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });

        // إن كان مسجّلاً دخوله مسبقاً، حوّله للرئيسية
        (async () => {
            try {
                const r = await fetch('../../../auth.php?action=me', { cache: 'no-store' });
                const me = JSON.parse(await r.text());
                if (me && me.authed) location.replace('../../../index.html');
            } catch (e) { /* PHP غير متاح (تشغيل محلي) */ }
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.classList.add('hidden');
            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحقق...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            try {
                const r = await fetch('../../../auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify({ username: document.getElementById('username').value, password: passInput.value })
                });
                const data = JSON.parse(await r.text());
                if (r.ok && data.authed) { 
                    if (!localStorage.getItem('saddahFastLoginCredId') && window.PublicKeyCredential) {
                        promptFastLoginSetup();
                    } else {
                        location.replace('../../../index.html');
                    }
                    return; 
                }
                errText.textContent = data.error || 'بيانات الدخول غير صحيحة.';
                errEl.classList.remove('hidden');
            } catch (err) {
                errText.textContent = 'تعذّر الاتصال بالخادم. تأكد من اتصالك.';
                errEl.classList.remove('hidden');
            }
            btn.disabled = false; 
            btn.innerHTML = 'تسجيل الدخول <i class="fa-solid fa-arrow-left text-sm relative top-[1px]"></i>';
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
        });

    <!-- Fast Login JS Logic -->
    <script>
        const fastLoginUsername = localStorage.getItem('saddahFastLoginUsername');
        const fastLoginCredId = localStorage.getItem('saddahFastLoginCredId');
        
        const fastLoginBtn = document.getElementById('fast-login-btn');
        const fastLoginModal = document.getElementById('fast-login-modal');
        const fastLoginModalContent = document.getElementById('fast-login-modal-content');
        const loginBtn = document.getElementById('login-btn');

        // دوال مساعدة لتحويل الـ ArrayBuffer
        function bufferToBase64(buffer) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
        }
        function base64ToBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
            return bytes.buffer;
        }

        // أظهر زر الدخول السريع إذا كان مفعلًا
        if (fastLoginCredId && fastLoginUsername && window.PublicKeyCredential) {
            fastLoginBtn.classList.remove('hidden');
            loginBtn.classList.add('hidden'); // إخفاء زر الدخول العادي كنوع من التركيز
            
            // يمكن للمستخدم إظهار الدخول العادي بمجرد التفاعل مع حقول النص
            document.getElementById('password').addEventListener('input', () => {
                loginBtn.classList.remove('hidden');
            });
        }

        // تنفيذ عملية الدخول السريع عند النقر
        fastLoginBtn.addEventListener('click', async () => {
            try {
                fastLoginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الاتصال...';
                
                // جلب رمز التحدي العشوائي من السيرفر
                let r = await fetch('auth.php?action=webauthn_challenge');
                let challengeData = await r.json();
                if (!challengeData.challenge) throw new Error('فشل جلب تحدي السيرفر');
                
                const challengeArray = base64ToBuffer(challengeData.challenge);
                
                const options = {
                    publicKey: {
                        challenge: challengeArray,
                        timeout: 60000,
                        userVerification: "required"
                    }
                };

                // تحديد المفتاح المحفوظ لطلب البصمة مباشرة (يمنع ظهور شاشة اختيار حسابات قوقل)
                if (fastLoginCredId) {
                    options.publicKey.allowCredentials = [{
                        type: 'public-key',
                        id: base64ToBuffer(fastLoginCredId)
                    }];
                }
                
                // هنا تظهر البصمة للمستخدم
                const assertion = await navigator.credentials.get(options);

                // تجهيز التوقيع والمصادقة لإرسالها
                fastLoginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحقق...';
                
                const payload = {
                    username: fastLoginUsername,
                    credId: assertion.id,
                    authData: bufferToBase64(assertion.response.authenticatorData),
                    clientData: bufferToBase64(assertion.response.clientDataJSON),
                    signature: bufferToBase64(assertion.response.signature)
                };

                r = await fetch('auth.php?action=webauthn_verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const data = JSON.parse(await r.text());
                if (r.ok && data.authed) { 
                    location.replace('index.html'); 
                } else {
                    throw new Error(data.error || 'فشل التحقق من التوقيع');
                }
            } catch (err) {
                console.error(err);
                errText.textContent = err.message || 'تم إلغاء أو فشل الدخول السريع. الرجاء استخدام كلمة المرور.';
                errEl.classList.remove('hidden');
                fastLoginBtn.innerHTML = '<i class="fa-solid fa-fingerprint text-xl"></i> الدخول السريع (FaceID / بصمة)';
                loginBtn.classList.remove('hidden');
            }
        });

        // التعامل مع تفعيل البصمة بعد تسجيل الدخول بنجاح
        async function promptFastLoginSetup() {
            // التحقق من دعم الجهاز
            if (!window.PublicKeyCredential) {
                location.replace('index.html');
                return;
            }
            
            // إظهار النافذة
            fastLoginModal.classList.remove('opacity-0', 'pointer-events-none');
            fastLoginModalContent.classList.remove('scale-95');
            fastLoginModalContent.classList.add('scale-100');

            document.getElementById('skip-fast-login-btn').onclick = () => {
                location.replace('index.html');
            };

            document.getElementById('enable-fast-login-btn').onclick = async () => {
                const btn = document.getElementById('enable-fast-login-btn');
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التفعيل...';
                
                try {
                    // طلب تحدي من السيرفر لربط التسجيل به
                    let r = await fetch('auth.php?action=webauthn_challenge');
                    let challengeData = await r.json();
                    if (!challengeData.challenge) throw new Error('فشل جلب التحدي');
                    
                    const challengeArray = base64ToBuffer(challengeData.challenge);
                    const userid = new Uint8Array(16);
                    window.crypto.getRandomValues(userid);

                    const cred = await navigator.credentials.create({
                        publicKey: {
                            challenge: challengeArray,
                            rp: { name: "نظام صده", id: location.hostname },
                            user: { id: userid, name: document.getElementById('username').value, displayName: "مستخدم صده" },
                            pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -257}],
                            authenticatorSelection: { 
                                authenticatorAttachment: "platform", 
                                userVerification: "required",
                                residentKey: "discouraged" // لضمان بقائها في الجهاز وعدم رفعها לסحابة خارجية
                            },
                            timeout: 60000
                        }
                    });

                    // استخراج المفتاح العام من البصمة
                    let pubKeyBuffer = null;
                    if (cred && cred.response && typeof cred.response.getPublicKey === 'function') {
                        pubKeyBuffer = cred.response.getPublicKey();
                    } else if (cred && cred.response && typeof cred.response.getPublicKeyAlgorithm === 'function') {
                        throw new Error('متصفحك غير مدعوم للحصول على المفتاح الأصلي.');
                    }
                    
                    if (!pubKeyBuffer) {
                        throw new Error('فشل قراءة المفتاح من جهازك.');
                    }
                    
                    // إذا نجح تسجيل البصمة، نطلب توكن من السيرفر
                    r = await fetch('auth.php?action=webauthn_register', { 
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            credId: bufferToBase64(cred.rawId),
                            pubKey: bufferToBase64(pubKeyBuffer)
                        })
                    });
                    
                    const data = await r.json();
                    
                    if (data.ok) {
                        localStorage.setItem('saddahFastLoginCredId', bufferToBase64(cred.rawId));
                        localStorage.setItem('saddahFastLoginUsername', document.getElementById('username').value);
                    } else {
                        throw new Error(data.error || 'فشل الحفظ في السيرفر');
                    }
                    
                } catch (err) {
                    console.error("Fast login setup failed", err);
                    alert('فشل تفعيل البصمة: ' + err.message);
                } finally {
                    location.replace('index.html');
                }
            };
        }
        
        const originalFormSubmit = form.onsubmit; // لا يوجد onsubmit حاليا إنما مستمع أحداث. سأبحث عن الاستدعاء أعلاه.
    </script>

<!-- Particles Animation (MagicUI Vanilla Clone) -->
<script>
    (function() {
        const canvas = document.getElementById('particles-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        const particles = [];
        // Dynamically adjust quantity based on device capability (less on mobile = perfectly smooth)
        const quantity = window.innerWidth < 768 ? 50 : 100;
        const color = 'rgba(79, 70, 229, 0.6)'; // text-indigo-600
        
        // Debounce resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }, 200);
        });
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 2 + 1;
            }
            
            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                this.x += this.vx + (Math.random() - 0.5) * 0.05;
                this.y += this.vy + (Math.random() - 0.5) * 0.05;
                
                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                else if (this.x > width) { this.x = width; this.vx *= -1; }
                
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                else if (this.y > height) { this.y = height; this.vy *= -1; }
            }
        }
        
        for (let i = 0; i < quantity; i++) {
            particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw all particles in a single path (Massive GPU/CPU boost)
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < quantity; i++) {
                particles[i].update();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.arc(particles[i].x, particles[i].y, particles[i].size, 0, Math.PI * 2);
            }
            ctx.fill();
            
            // Draw lines using fast squared distance checks
            ctx.lineWidth = 1.0;
            for (let i = 0; i < quantity; i++) {
                for (let j = i + 1; j < quantity; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distSq = dx * dx + dy * dy;
                    
                    if (distSq < 10000) { // 100 * 100
                        let dist = Math.sqrt(distSq);
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(167, 139, 250, ${0.25 - (dist / 100) * 0.25})`;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        
        animate();
    })();
</script>
