<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>window.SaddahBase = '../../..';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة مرفق - صده</title>
    <link rel="manifest" href="../../../manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="../../../assets/images/icon-192.png">
    <link rel="apple-touch-icon" href="../../../assets/images/icon-192.png">
    <style>
        body { font-family: sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; color:#475569; }
        .spin { width:42px; height:42px; border:4px solid #e2e8f0; border-top-color:#dc2626; border-radius:50%; animation:r 0.8s linear infinite; margin:0 auto 14px; }
        @keyframes r { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="spin"></div>
        <p style="font-weight:bold;">جارٍ تجهيز المرفق…</p>
    </div>
    <script>
        // صفحة المشاركة موحّدة الآن في share_attach.html — نحوّل مع الحفاظ على البارامترات
        (function () {
            const p = new URLSearchParams(location.search);
            const q = new URLSearchParams();
            if (p.get('fileId'))  q.set('fileId', p.get('fileId'));
            if (p.get('fileUrl')) q.set('fileUrl', p.get('fileUrl'));
            if (p.get('action'))  q.set('action', p.get('action'));
            const qs = q.toString();
            location.replace('share_attach.html' + (qs ? '?' + qs : ''));
        })();
    </script>
</body>
</html>
