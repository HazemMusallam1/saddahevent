<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العملاء - صدة</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/app-responsive.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css?v=2">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; } </style>
</head>

<body class="text-slate-800 min-h-screen">

    <!-- شريط علوي -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-lg"><i class="fa-solid fa-address-book"></i></span>
                <div class="leading-tight">
                    <div class="font-black text-slate-800 text-lg">سجل العملاء</div>
                    <div class="text-[10px] font-bold tracking-[0.2em] text-brand-600 font-inter uppercase">Customers</div>
                </div>
            </div>
            <a href="index.html" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-house"></i> الرئيسية
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ملخص -->
        <section class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white border border-slate-200 rounded-2xl px-5 py-4 flex items-center gap-3 shadow-sm">
                <span class="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></span>
                <div>
                    <div class="text-2xl font-black text-slate-800 font-inter leading-none" id="cust-count">—</div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">إجمالي العملاء</div>
                </div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl px-5 py-4 flex items-center gap-3 shadow-sm">
                <span class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-phone"></i></span>
                <div>
                    <div class="text-2xl font-black text-slate-800 font-inter leading-none" id="cust-phones">—</div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">لديهم رقم جوال</div>
                </div>
            </div>
        </section>

        <!-- جدول العملاء -->
        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 right-3 text-slate-300 text-sm"></i>
                    <input type="text" oninput="searchCustomers(this.value)" placeholder="ابحث باسم العميل أو رقم الجوال..."
                        class="w-full border border-slate-200 rounded-xl pr-10 pl-4 py-2.5 text-sm focus:outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full min-w-[560px]">
                    <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase font-bold tracking-wider border-b border-slate-200">
                        <tr>
                            <th class="py-3 px-3 text-right">العميل</th>
                            <th class="py-3 px-3 text-right">الجوال</th>
                            <th class="py-3 px-3 text-right">العنوان</th>
                            <th class="py-3 px-3 text-center">عدد الطلبات</th>
                            <th class="py-3 px-3 text-center">إجمالي القيمة</th>
                        </tr>
                    </thead>
                    <tbody id="cust-rows" class="bg-white text-sm">
                        <tr><td colspan="5" class="text-center text-slate-400 py-8 text-sm font-bold">جارٍ التحميل…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/fs-manager.js"></script>
    <script src="scripts/core/db.js"></script>
    <script src="scripts/crm/customers.js"></script>
<script src="scripts/modules/whatsapp-widget.js"></script>
<script>
    if("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(console.error);
    }
</script>
</body>

</html>
